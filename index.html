<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI HUB</title>

<style>
* { box-sizing: border-box; }
body { margin: 0; background: #080d1b; color: #edf2ff; font-family: Arial, sans-serif; overflow-x: hidden; }
.app { display: flex; min-height: 100vh; }

/* --- BARRE LATÉRALE (SIDEBAR) --- */
.sidebar {
  width: 260px;
  background: #0b1222;
  border-right: 1px solid #25324c;
  padding: 15px;
  position: fixed;
  height: 100vh;
  left: -260px; /* Caché par défaut sur mobile */
  top: 0;
  z-index: 100;
  transition: left 0.3s ease;
  display: flex;
  flex-direction: column;
}
.sidebar.open { left: 0; }
.sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.sidebar-header h1 { font-size: 20px; margin: 0; }
.close-btn { background: transparent; border: none; font-size: 20px; color: #9aaccb; cursor: pointer; }

.new-chat { width: 100%; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(120deg, #7551f5, #2779ff); font-weight: bold; margin-bottom: 15px; color: white; cursor: pointer; }

.session-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
.session-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px; border-radius: 8px; background: transparent; color: #cbd7ef;
  border: none; text-align: left; cursor: pointer; font-size: 13px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session-item:hover, .session-item.active { background: #18243b; }
.session-item.active { border-left: 3px solid #2779ff; }
.delete-btn { background: transparent; border: none; color: #ff5c5c; cursor: pointer; font-size: 14px; padding: 5px; opacity: 0.5; }
.delete-btn:hover { opacity: 1; }

/* Overlay sombre sur mobile quand le menu est ouvert */
.overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 99; display: none; }
.overlay.active { display: block; }

/* --- ZONE PRINCIPALE --- */
.main { flex: 1; padding: 15px; display: flex; flex-direction: column; min-width: 0; width: 100%; }
.top-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
.menu-btn { background: #121e35; border: 1px solid #2c3b59; color: white; border-radius: 8px; padding: 8px 12px; font-size: 18px; cursor: pointer; }

.modes { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; flex: 1; }
.mode { padding: 8px 14px; border-radius: 10px; border: 1px solid #283751; background: #121c30; white-space: nowrap; color: #cbd7ef; cursor: pointer; font-size: 13px; }
.mode.active { background: linear-gradient(120deg, #744df2, #2581ff); color: white; border: none; }

.welcome { text-align: center; margin: 40px 0 20px; }
.welcome h2 { font-size: 24px; }
.welcome p { color: #9aaccb; font-size: 14px; }

/* --- CHAT --- */
.chat { display: flex; flex-direction: column; gap: 12px; flex: 1; overflow-y: auto; margin-bottom: 15px; }
.message { padding: 12px; border-radius: 12px; max-width: 90%; white-space: pre-wrap; line-height: 1.5; font-size: 15px; }
.user { align-self: flex-end; background: #294d91; }
.assistant { align-self: flex-start; background: #162139; border: 1px solid #293955; }

/* --- BARRE DE SAISIE --- */
.composer { padding: 12px; background: #17233d; border: 1px solid #344768; border-radius: 15px; }
textarea { width: 100%; min-height: 50px; resize: none; color: white; background: transparent; border: none; outline: none; font-size: 15px; font-family: inherit; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.tool { padding: 8px 12px; background: #121e35; border: 1px solid #2c3b59; border-radius: 20px; color: #cbd7ef; font-size: 13px; cursor: pointer; }
.send { margin-left: auto; width: 40px; height: 40px; border: none; border-radius: 50%; background: linear-gradient(120deg, #744df2, #2481ff); font-size: 18px; color: white; cursor: pointer; }

/* Pour les grands écrans (PC/Mac) : Barre latérale toujours visible */
@media(min-width: 768px) {
  .sidebar { left: 0; position: static; }
  .main { margin-left: 0; }
  .menu-btn, .close-btn { display: none; }
  .overlay { display: none !important; }
}
</style>
</head>
<body>

<!-- Overlay pour fermer le menu sur mobile -->
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="app">
  <!-- MENU LATÉRAL -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>🧠 AI HUB</h1>
      <button class="close-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <button class="new-chat" onclick="newChat()">＋ Nouvelle discussion</button>
    <div class="session-list" id="sessionList">
      <!-- La liste des conversations apparaîtra ici -->
    </div>
  </aside>

  <!-- ZONE PRINCIPALE -->
  <main class="main">
    <div class="top-bar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="modes">
        <button class="mode active" onclick="setMode('Auto',this)">✨ Auto</button>
        <button class="mode" onclick="setMode('Claude',this)">✳ Claude</button>
        <button class="mode" onclick="setMode('Gemini',this)">✦ Gemini</button>
        <button class="mode" onclick="setMode('DeepSeek',this)">◈ DeepSeek</button>
        <button class="mode" onclick="setMode('Vision',this)">👁️ Vision</button>
      </div>
    </div>

    <section class="welcome" id="welcome">
      <h2>Bienvenue sur AI HUB ! 👋</h2>
      <p>Pose ta question, explore les possibilités et laisse la magie de l'IA opérer...</p>
    </section>

    <div class="chat" id="chat"></div>

    <div class="composer">
      <textarea id="prompt" placeholder="Pose-moi une question..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
      <div class="tools">
        <button class="tool" onclick="document.getElementById('fileInput').click()">▧ Image</button>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleImageUpload(this)">
        <button class="send" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </main>
</div>

<script>
// ==========================================
// GESTION DES DISCUSSIONS (SESSIONS)
// ==========================================
let sessions = JSON.parse(localStorage.getItem('ai_hub_sessions')) || [];
let currentSessionId = null;
let currentMode = "auto"; 
window.currentUploadedFile = null;

// Au démarrage
window.onload = function() {
  if (sessions.length > 0) {
    // On charge la plus récente
    loadSession(sessions[0].id);
  } else {
    newChat(); // Crée une session vierge si c'est vide
  }
  renderSidebar();
};

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('active');
}

function newChat() {
  const newId = Date.now().toString();
  const newSession = {
    id: newId,
    title: "Nouvelle discussion",
    messages: []
  };
  sessions.unshift(newSession); // Ajoute au début de la liste
  saveSessions();
  loadSession(newId);
  renderSidebar();
  if (window.innerWidth < 768) toggleSidebar(); // Ferme le menu sur mobile
}

function loadSession(id) {
  currentSessionId = id;
  const session = sessions.find(s => s.id === id);
  if (!session) return;

  const chatDiv = document.getElementById("chat");
  chatDiv.innerHTML = "";
  
  if (session.messages.length === 0) {
    document.getElementById("welcome").style.display = "block";
  } else {
    document.getElementById("welcome").style.display = "none";
    session.messages.forEach(msg => {
      // On n'affiche que les textes (pour éviter de bugger si c'est une image)
      let textToDisplay = typeof msg.content === 'string' ? msg.content : "[Image envoyée]";
      if (msg.role === 'user' || msg.role === 'assistant') {
        addMessageToUI(textToDisplay, msg.role);
      }
    });
  }
  renderSidebar(); // Met à jour la surbrillance dans le menu
}

function deleteSession(id, event) {
  event.stopPropagation(); // Empêche de charger la session quand on clique sur poubelle
  if(confirm("Supprimer cette discussion ?")) {
    sessions = sessions.filter(s => s.id !== id);
    saveSessions();
    if (currentSessionId === id) {
      if (sessions.length > 0) loadSession(sessions[0].id);
      else newChat();
    } else {
      renderSidebar();
    }
  }
}

function saveSessions() {
  localStorage.setItem('ai_hub_sessions', JSON.stringify(sessions));
}

// Affiche la liste des discussions dans la sidebar
function renderSidebar() {
  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  sessions.forEach(session => {
    const btn = document.createElement('button');
    btn.className = 'session-item ' + (session.id === currentSessionId ? 'active' : '');
    
    const titleSpan = document.createElement('span');
    titleSpan.textContent = session.title;
    titleSpan.style.overflow = "hidden";
    titleSpan.style.textOverflow = "ellipsis";
    
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.innerHTML = '🗑️';
    delBtn.onclick = (e) => deleteSession(session.id, e);

    btn.appendChild(titleSpan);
    btn.appendChild(delBtn);
    btn.onclick = () => {
      loadSession(session.id);
      if (window.innerWidth < 768) toggleSidebar();
    };
    list.appendChild(btn);
  });
}

// ==========================================
// GESTION DU CHAT ET DE L'IA
// ==========================================
function setMode(m, button) {
  if (m === "Claude") currentMode = "claude";
  else if (m === "Gemini") currentMode = "gemini";
  else if (m === "Vision") currentMode = "vision";
  else currentMode = "auto";

  document.querySelectorAll(".mode").forEach(b => b.classList.remove("active"));
  if (button) button.classList.add("active");
}

function addMessageToUI(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
  return div;
}

function handleImageUpload(input) {
  if (input.files && input.files[0]) {
    window.currentUploadedFile = input.files[0];
    document.getElementById("prompt").value += "\n[Image prête] ";
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = error => reject(error);
  });
}

async function sendMessage() {
  const box = document.getElementById("prompt");
  const text = box.value.trim();
  if (!text && !window.currentUploadedFile) return;

  const session = sessions.find(s => s.id === currentSessionId);
  if (!session) return;

  document.getElementById("welcome").style.display = "none";

  // Préparation de l'image si présente
  let userContent = text;
  if (window.currentUploadedFile) {
    const base64 = await fileToBase64(window.currentUploadedFile);
    userContent = [
      { type: "text", text: text },
      { type: "image_url", image_url: { url: `data:${window.currentUploadedFile.type};base64,${base64}` } }
    ];
    currentMode = "vision"; 
  }

  // 1. Mise à jour de l'UI
  addMessageToUI(text || "[Image]", "user");
  
  // 2. Mise à jour de la mémoire de la session
  session.messages.push({ role: "user", content: userContent });
  
  // Si c'est le premier message, on renomme la discussion avec la question
  if (session.messages.length === 1) {
    session.title = text.substring(0, 30) + (text.length > 30 ? "..." : "");
    renderSidebar();
  }
  saveSessions();

  box.value = "";
  window.currentUploadedFile = null;

  // 3. Préparation de l'attente
  const loadingDiv = addMessageToUI("Réflexion...", "assistant");

  try {
    // 4. Appel au proxy
    const response = await fetch("https://ai-hub-proxy.pasquet-gregory.workers.dev", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: currentMode,
        messages: session.messages, // On envoie tout l'historique de CETTE session
        stream: true
      })
    });

    if (!response.ok) throw new Error("Erreur");

    loadingDiv.textContent = ""; 
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = "";

    // 5. Lecture du flux
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split("\n").filter(l => l.trim() !== "");
      
      for (const line of lines) {
        if (line.startsWith("data: ")) {
          const data = line.slice(6);
          if (data === "[DONE]") continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content;
            if (delta) {
              fullText += delta;
              loadingDiv.textContent = fullText;
              document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
            }
          } catch (e) {}
        }
      }
    }

    // 6. Sauvegarde de la réponse dans la session
    session.messages.push({ role: "assistant", content: fullText });
    saveSessions();

  } catch (error) {
    loadingDiv.textContent = "Erreur de connexion.";
  }
}
</script>
</body>
</html>
