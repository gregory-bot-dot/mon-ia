<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI HUB</title>

<style>
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #080d1b; color: #edf2ff; font-family: Arial, sans-serif; overflow-x: hidden; }
.app { display: flex; height: 100vh; height: 100dvh; }

/* --- BARRE LATÉRALE --- */
.sidebar {
  width: 260px;
  background: #0b1222;
  border-right: 1px solid #25324c;
  padding: 15px;
  position: fixed;
  height: 100vh;
  height: 100dvh;
  left: -260px;
  top: 0;
  z-index: 100;
  transition: left 0.3s ease;
  display: flex;
  flex-direction: column;
}
.sidebar.open { left: 0; }
.sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.sidebar-header h1 { font-size: 20px; margin: 0; }
.close-btn { background: transparent; border: none; font-size: 20px; color: #9aaccb; cursor: pointer; }

.new-chat { width: 100%; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(120deg, #7551f5, #2779ff); font-weight: bold; margin-bottom: 15px; color: white; cursor: pointer; }

.session-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
.session-item {
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
  padding: 10px; border-radius: 8px; background: transparent; color: #cbd7ef;
  border: none; text-align: left; cursor: pointer; font-size: 13px;
}
.session-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-item:hover, .session-item.active { background: #18243b; }
.session-item.active { border-left: 3px solid #2779ff; }
.delete-btn { background: transparent; border: none; color: #ff5c5c; cursor: pointer; font-size: 14px; padding: 5px; opacity: 0.5; flex-shrink: 0; }
.delete-btn:hover { opacity: 1; }

.overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 99; display: none; }
.overlay.active { display: block; }

/* --- ZONE PRINCIPALE --- */
.main {
  flex: 1; padding: 15px; padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; min-width: 0; width: 100%; min-height: 0;
}
.top-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; flex-shrink: 0; }
.menu-btn { background: #121e35; border: 1px solid #2c3b59; color: white; border-radius: 8px; padding: 8px 12px; font-size: 18px; cursor: pointer; }

.modes { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; flex: 1; }
.mode { padding: 8px 14px; border-radius: 10px; border: 1px solid #283751; background: #121c30; white-space: nowrap; color: #cbd7ef; cursor: pointer; font-size: 13px; }
.mode.active { background: linear-gradient(120deg, #744df2, #2581ff); color: white; border-color: transparent; }

.welcome { text-align: center; margin: 40px 0 20px; }
.welcome h2 { font-size: 24px; }
.welcome p { color: #9aaccb; font-size: 14px; }

/* --- CHAT --- */
.chat { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; overflow-y: auto; margin-bottom: 15px; }
.message { padding: 12px; border-radius: 12px; max-width: 90%; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; font-size: 15px; }
.user { align-self: flex-end; background: #294d91; }
.assistant { align-self: flex-start; background: #162139; border: 1px solid #293955; }
.assistant.error { border-color: #7a3340; color: #ffb4bf; }

/* --- SAISIE --- */
.composer { padding: 12px; background: #17233d; border: 1px solid #344768; border-radius: 15px; flex-shrink: 0; }
textarea { width: 100%; min-height: 50px; max-height: 140px; resize: none; color: white; background: transparent; border: none; outline: none; font-size: 16px; font-family: inherit; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.tool { padding: 8px 12px; background: #121e35; border: 1px solid #2c3b59; border-radius: 20px; color: #cbd7ef; font-size: 13px; cursor: pointer; }
.tool.ready { border-color: #36dba0; color: #36dba0; }
.send { margin-left: auto; width: 40px; height: 40px; border: none; border-radius: 50%; background: linear-gradient(120deg, #744df2, #2481ff); font-size: 18px; color: white; cursor: pointer; }
.send:disabled { opacity: 0.5; cursor: default; }

@media(min-width: 768px) {
  .sidebar { left: 0; position: static; }
  .menu-btn, .close-btn { display: none; }
  .overlay { display: none !important; }
}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>🧠 AI HUB</h1>
      <button class="close-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <button class="new-chat" onclick="newChat()">＋ Nouvelle discussion</button>
    <div class="session-list" id="sessionList"></div>
  </aside>

  <main class="main">
    <div class="top-bar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="modes">
        <button class="mode active" data-mode="auto" onclick="setMode('auto',this)">✨ Auto</button>
        <button class="mode" data-mode="claude" onclick="setMode('claude',this)">✳ Claude</button>
        <button class="mode" data-mode="gemini" onclick="setMode('gemini',this)">✦ Gemini</button>
        <button class="mode" data-mode="deepseek" onclick="setMode('deepseek',this)">◈ DeepSeek</button>
        <button class="mode" data-mode="vision" onclick="setMode('vision',this)">👁️ Vision</button>
      </div>
    </div>

    <section class="welcome" id="welcome">
      <h2>Bienvenue sur AI HUB ! 👋</h2>
      <p>Pose ta question, explore les possibilités et laisse la magie de l'IA opérer...</p>
    </section>

    <div class="chat" id="chat"></div>

    <div class="composer">
      <textarea id="prompt" placeholder="Pose-moi une question..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
      <div class="tools">
        <button class="tool" id="imageBtn" onclick="document.getElementById('fileInput').click()">▧ Image</button>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleImageUpload(this)">
        <button class="send" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </main>
</div>

<script>
// ==========================================
// RÉGLAGES
// ==========================================
const PROXY_URL = "https://ai-hub-proxy.pasquet-gregory.workers.dev";

// ==========================================
// DISCUSSIONS (SESSIONS)
// ==========================================
let sessions = [];
try { sessions = JSON.parse(localStorage.getItem('ai_hub_sessions')) || []; } catch (e) { sessions = []; }

let currentSessionId = null;
let currentMode = "auto";
let pendingImage = null;   // image choisie, pas encore envoyée
let isSending = false;

window.onload = function () {
  if (sessions.length > 0) loadSession(sessions[0].id);
  else newChat();
  renderSidebar();
};

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('active');
}

function closeSidebarOnMobile() {
  if (window.innerWidth < 768 && document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
}

function newChat() {
  // Réutilise la discussion vide existante au lieu d'en créer une de plus
  const empty = sessions.find(s => s.messages.length === 0);
  if (empty) {
    loadSession(empty.id);
  } else {
    const newId = Date.now().toString();
    sessions.unshift({ id: newId, title: "Nouvelle discussion", messages: [] });
    saveSessions();
    loadSession(newId);
  }
  renderSidebar();
  closeSidebarOnMobile();
}

function loadSession(id) {
  currentSessionId = id;
  const session = sessions.find(s => s.id === id);
  if (!session) return;

  const chatDiv = document.getElementById("chat");
  chatDiv.innerHTML = "";

  if (session.messages.length === 0) {
    document.getElementById("welcome").style.display = "block";
  } else {
    document.getElementById("welcome").style.display = "none";
    session.messages.forEach(msg => {
      if (msg.role === 'user' || msg.role === 'assistant') {
        addMessageToUI(msg.content, msg.role);
      }
    });
  }
  renderSidebar();
}

function deleteSession(id, event) {
  event.stopPropagation();
  if (confirm("Supprimer cette discussion ?")) {
    sessions = sessions.filter(s => s.id !== id);
    saveSessions();
    if (currentSessionId === id) {
      if (sessions.length > 0) loadSession(sessions[0].id);
      else newChat();
    } else {
      renderSidebar();
    }
  }
}

function saveSessions() {
  try {
    localStorage.setItem('ai_hub_sessions', JSON.stringify(sessions));
  } catch (e) {
    // Stockage plein : on retire les plus anciennes discussions
    while (sessions.length > 1) {
      sessions.pop();
      try { localStorage.setItem('ai_hub_sessions', JSON.stringify(sessions)); return; } catch (e2) {}
    }
  }
}

function renderSidebar() {
  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  sessions.forEach(session => {
    const btn = document.createElement('button');
    btn.className = 'session-item ' + (session.id === currentSessionId ? 'active' : '');

    const titleSpan = document.createElement('span');
    titleSpan.textContent = session.title;

    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.textContent = '🗑️';
    delBtn.onclick = (e) => deleteSession(session.id, e);

    btn.appendChild(titleSpan);
    btn.appendChild(delBtn);
    btn.onclick = () => { loadSession(session.id); closeSidebarOnMobile(); };
    list.appendChild(btn);
  });
}

// ==========================================
// CHAT ET IA
// ==========================================
function setMode(m, button) {
  currentMode = m;
  document.querySelectorAll(".mode").forEach(b => b.classList.remove("active"));
  if (button) button.classList.add("active");
}

function addMessageToUI(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  const chat = document.getElementById("chat");
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function handleImageUpload(input) {
  if (input.files && input.files[0]) {
    pendingImage = input.files[0];
    const btn = document.getElementById("imageBtn");
    btn.classList.add("ready");
    btn.textContent = "▧ Image prête ✓";
  }
}

function clearPendingImage() {
  pendingImage = null;
  document.getElementById("fileInput").value = "";
  const btn = document.getElementById("imageBtn");
  btn.classList.remove("ready");
  btn.textContent = "▧ Image";
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = error => reject(error);
  });
}

async function sendMessage() {
  if (isSending) return;

  const box = document.getElementById("prompt");
  const text = box.value.trim();
  if (!text && !pendingImage) return;

  const session = sessions.find(s => s.id === currentSessionId);
  if (!session) return;

  isSending = true;
  document.getElementById("sendBtn").disabled = true;
  document.getElementById("welcome").style.display = "none";

  // Contenu envoyé à l'IA pour CE message (avec l'image si présente)
  let requestContent = text;
  let requestMode = currentMode;
  let storedText = text;

  if (pendingImage) {
    try {
      const base64 = await fileToBase64(pendingImage);
      requestContent = [
        { type: "text", text: text || "Décris cette image." },
        { type: "image_url", image_url: { url: "data:" + pendingImage.type + ";base64," + base64 } }
      ];
      requestMode = "vision";            // uniquement pour cet envoi
      storedText = "[Image] " + (text || "");
    } catch (e) {
      addMessageToUI("Impossible de lire l'image.", "assistant error");
      isSending = false;
      document.getElementById("sendBtn").disabled = false;
      return;
    }
  }

  addMessageToUI(storedText, "user");

  // L'historique sauvegardé ne garde que du texte (une image en base64 remplit le stockage)
  const history = session.messages.slice();
  session.messages.push({ role: "user", content: storedText });

  if (session.messages.length === 1) {
    const t = (text || "Image").trim();
    session.title = t.substring(0, 30) + (t.length > 30 ? "..." : "");
    renderSidebar();
  }
  saveSessions();

  box.value = "";
  clearPendingImage();

  const loadingDiv = addMessageToUI("Réflexion...", "assistant");
  const messagesToSend = history.concat([{ role: "user", content: requestContent }]);

  try {
    const response = await fetch(PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: requestMode, messages: messagesToSend, stream: true })
    });

    if (!response.ok) {
      const err = await response.text();
      throw new Error("HTTP " + response.status + " : " + err.slice(0, 200));
    }

    loadingDiv.textContent = "";
    const chat = document.getElementById("chat");
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = "";
    let raw = "";
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      raw += chunk;
      buffer += chunk;

      const lines = buffer.split("\n");
      buffer = lines.pop();            // garde la ligne incomplète pour le tour suivant

      for (const line of lines) {
        const l = line.trim();
        if (!l.startsWith("data:")) continue;
        const data = l.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) {
            fullText += delta;
            loadingDiv.textContent = fullText;
            chat.scrollTop = chat.scrollHeight;
          }
        } catch (e) {}
      }
    }

    // Dernière ligne restée dans le tampon
    const last = buffer.trim();
    if (last.startsWith("data:")) {
      try {
        const json = JSON.parse(last.slice(5).trim());
        const delta = json.choices?.[0]?.delta?.content;
        if (delta) { fullText += delta; loadingDiv.textContent = fullText; }
      } catch (e) {}
    }

    // Repli : réponse non streamée (JSON classique)
    if (!fullText) {
      try {
        const json = JSON.parse(raw);
        fullText = json.choices?.[0]?.message?.content
          || json.error?.message
          || (typeof json.error === "string" ? json.error : "")
          || json.content?.[0]?.text
          || "";
      } catch (e) {}
      if (fullText) loadingDiv.textContent = fullText;
    }

    // Toujours vide : on montre ce que le proxy a renvoyé
    if (!fullText) {
      loadingDiv.className = "message assistant error";
      loadingDiv.textContent = "Réponse vide du proxy :\n" + (raw.slice(0, 300) || "(rien reçu)");
      session.messages.pop();          // retire la question pour ne pas polluer l'historique
      saveSessions();
      return;
    }

    session.messages.push({ role: "assistant", content: fullText });
    saveSessions();

  } catch (error) {
    loadingDiv.className = "message assistant error";
    loadingDiv.textContent = "Erreur : " + error.message;
    session.messages.pop();            // la question n'a pas reçu de réponse
    saveSessions();
  } finally {
    isSending = false;
    document.getElementById("sendBtn").disabled = false;
  }
}
</script>
</body>
</html>
